name: Apply crisis-aware baseline patch

on:
  push:
    branches:
      - agent/crisis-aware-demand-baseline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply crisis-aware baseline to n8n workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crisis-aware-demand-baseline
          fetch-depth: 0

      - name: Patch n8n workflow
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow_path = Path('gasolina-fear-greed-workflow(1).json')
          code_path = Path('workflow-baseline-code.js')
          action_path = Path('.github/workflows/apply-crisis-baseline-patch.yml')

          workflow = json.loads(workflow_path.read_text(encoding='utf-8'))
          new_code = code_path.read_text(encoding='utf-8')

          by_name = {n['name']: n for n in workflow['nodes']}
          by_name['Construir datos e indices']['parameters']['jsCode'] = new_code

          crisis_name = 'GitHub - Leer crises.json'
          if crisis_name not in by_name:
              source = by_name['GitHub - Leer saldos del día']
              crisis_node = json.loads(json.dumps(source))
              crisis_node['id'] = 'bd343979-0f98-4ae0-9b11-05a792914e64'
              crisis_node['name'] = crisis_name
              crisis_node['position'] = [-480, 272]
              crisis_node['parameters']['filePath'] = "={{ $('Configuracion').first().json.dataRoot + '/crises.json' }}"
              workflow['nodes'].append(crisis_node)

          workflow['connections']['GitHub - Leer saldos del día'] = {
              'main': [[{'node': crisis_name, 'type': 'main', 'index': 0}]]
          }
          workflow['connections'][crisis_name] = {
              'main': [[{'node': 'Construir datos e indices', 'type': 'main', 'index': 0}]]
          }

          # El código nuevo no utiliza vehiclesEstimated ni queueMinutes. Se dejan de
          # publicar en latest/saldos nuevos, aunque el parser pueda seguir leyéndolos.
          workflow['name'] = 'Gasolina Fear & Greed - baseline demanda + crisis'
          workflow_path.write_text(json.dumps(workflow, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          code_path.unlink(missing_ok=True)
          action_path.unlink(missing_ok=True)
          PY

      - name: Commit patched workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'gasolina-fear-greed-workflow(1).json' public/data/crises.json -A
          git add -u workflow-baseline-code.js .github/workflows/apply-crisis-baseline-patch.yml
          git commit -m 'feat: apply crisis-aware baseline to n8n workflow'
          git push origin HEAD:agent/crisis-aware-demand-baseline
