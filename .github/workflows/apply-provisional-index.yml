name: Apply provisional index

on:
  push:
    branches:
      - agent/provisional-pressure-index
    paths:
      - 'scripts/apply-provisional-pressure-index.js'
      - '.github/workflows/apply-provisional-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provisional-pressure-index
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar cambios
        run: node scripts/apply-provisional-pressure-index.js
      - name: Validar app
        run: node --check app.js
      - name: Validar workflow n8n
        run: node -e "const w=require('./gasolina-fear-greed-workflow(1).json');const n=w.nodes.find(n=>n.name==='Construir datos e indices');new Function(n.parameters.jsCode);console.log('workflow js ok')"
      - name: Ejecutar pruebas
        run: node --test scripts/schema-contract.test.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css 'gasolina-fear-greed-workflow(1).json' public/data/latest.json public/data/history public/data/saldos
          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "feat: añadir indice de presión provisional"
            git push
          fi
