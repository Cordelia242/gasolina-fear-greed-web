name: Migrate fuel level and pressure

on:
  push:
    branches:
      - agent/separate-fuel-level-pressure-v2
    paths:
      - 'scripts/migrate-separate-fuel-pressure.js'
      - '.github/workflows/schema-contract.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/separate-fuel-level-pressure-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar migración y validar contrato
        run: node scripts/migrate-separate-fuel-pressure.js
      - name: Commit de archivos migrados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css 'gasolina-fear-greed-workflow(1).json' public/data/latest.json public/data/history public/data/saldos
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "refactor: separar nivel de combustible e índice de presión"
            git push
          fi
